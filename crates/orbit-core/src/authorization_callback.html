<!doctype html>
<html lang="zh-CN" data-outcome="{{outcome}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{title}} · Orbit</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: #21352c;
        background: #f5f7f4;
        color-scheme: light dark;
        --card: #fff;
        --muted: #647269;
        --border: #e3e9e3;
        --accent: #326b58;
        --tint: #edf5ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        width: min(100%, 460px);
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 28px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .brand svg {
        width: 36px;
        height: 36px;
        color: var(--accent);
      }
      .card {
        padding: 40px 32px 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 16px 48px #1b342608;
        text-align: center;
      }
      .status {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 50%;
        color: var(--accent);
        background: var(--tint);
      }
      .status svg {
        width: 30px;
        height: 30px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 650;
        line-height: 1.4;
        letter-spacing: -0.5px;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.8;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .next {
        margin-top: 28px;
        padding: 20px;
        border-radius: 14px;
        background: var(--tint);
        text-align: left;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.6;
      }
      .next p {
        font-size: 14px;
      }
      footer {
        margin-top: 24px;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }
      html[data-outcome="failed"] .status {
        color: #a24b37;
        background: #fbefeb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #e1eae4;
          background: #141a17;
          --card: #1b2420;
          --muted: #a2b1a7;
          --border: #303e35;
          --accent: #93c7ab;
          --tint: #25382d;
        }
        html[data-outcome="failed"] .status {
          color: #eda48e;
          background: #3a2b25;
        }
      }
      @media (max-width: 380px) {
        .card {
          padding: 32px 24px 24px;
        }
        .next {
          padding: 16px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 256 256" fill="none" aria-hidden="true">
          <path
            d="M205.274 107.294A80 80 0 1 1 148.706 50.726"
            stroke="currentColor"
            stroke-width="24"
          />
          <circle cx="191.640" cy="64.360" r="18" fill="currentColor" />
        </svg>
        <span>Orivelle Orbit</span>
      </div>
      <section class="card" aria-labelledby="result-title">
        <div class="status">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            {{icon}}
          </svg>
        </div>
        <h1 id="result-title">{{title}}</h1>
        <p>{{description}}</p>
        <div class="next">
          <h2>返回 Orbit 继续</h2>
          <p>{{next}}</p>
        </div>
      </section>
      <footer>现在可以关闭此页面</footer>
    </main>
  </body>
</html>
