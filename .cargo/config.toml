# Approved versions are present on rsproxy with checksums matching the official index.
# This replacement applies to this project only. Cargo.lock fixes package checksums.
[source.crates-io]
replace-with = "rsproxy-sparse"
[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"
[registries.crates-io]
protocol = "sparse"
[net]
retry = 2
[http]
multiplexing = false
timeout = 60
