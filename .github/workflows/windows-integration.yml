name: Windows Integration

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Run all checks or only the native acceptance being changed
        type: choice
        default: all
        options: [all, windows-desktop, macos-dmg]
      baseline-tag:
        description: Published tag whose native data should survive the candidate launch
        required: false
        type: string
      candidate-tag:
        description: Optional release version to apply in the hosted checkout
        required: false
        type: string
  push:
    branches: [develop]
    paths:
      - ".github/workflows/windows-integration.yml"
      - ".github/actions/prepare-native/action.yml"
      - "crates/orbit-core/src/**"
      - "scripts/native-workflow.mjs"
      - "src-tauri/src/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "tests/build/**"
      - "tests/windows/**"

permissions:
  contents: read

concurrency:
  group: orbit-windows-integration-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  validation:
    if: inputs.scope != 'windows-desktop' && inputs.scope != 'macos-dmg'
    name: Run Windows regression tests
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse Windows acceptance scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem tests/windows/*.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/cargo-home/registry
            runtime/target
          key: orbit-windows-regression-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}

      - uses: ./.github/actions/prepare-native

      - name: Run browser workflow tests
        run: npm run test:e2e -- --reporter=line --retries=1 --max-failures=3

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() }}
        with:
          name: orbit-windows-regression-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    if: inputs.scope != 'macos-dmg'
    name: Build and verify Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            runtime/cargo-home/registry
            runtime/target
          key: orbit-windows-candidate-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}

      - uses: ./.github/actions/prepare-native
        with:
          validate: "false"
          release-tag: ${{ inputs.candidate-tag }}

      - name: Build Windows x64 installer
        run: node scripts/native-workflow.mjs github-bundle

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            runtime/cargo-home/registry
            runtime/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Prepare WebView2 Runtime
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          )
          $version = Get-ItemPropertyValue -LiteralPath $keys -Name pv -ErrorAction SilentlyContinue |
            Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if ($version) {
            Write-Output "WebView2 Runtime: $version"
          } else {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $install = Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "WebView2 installation failed with exit code $($install.ExitCode)."
            }
          }

      - name: Verify installers and prepare the published baseline
        shell: pwsh
        env:
          ORBIT_BASELINE_TAG: ${{ inputs.baseline-tag }}
        run: ./tests/windows/prepare-installers.ps1

      - name: Exercise the packaged Orbit desktop executable
        shell: pwsh
        run: ./tests/windows/with-panel-fixture.ps1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: orbit-windows-integration
          path: |
            runtime/logs/native-preflight.json
            runtime/logs/candidate-manifest.json
            runtime/logs/windows-integration/
            runtime/github-release/*-setup.exe
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: Check macOS arm64 candidate
    if: inputs.candidate-tag != '' && inputs.scope != 'windows-desktop'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: macos-cache
        with:
          path: |
            runtime/cargo-home/registry
            runtime/target
          key: orbit-macos-dmg-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - uses: ./.github/actions/prepare-native
        with:
          validate: "false"
          release-tag: ${{ inputs.candidate-tag }}
      - name: Build macOS arm64 candidate
        run: node scripts/native-workflow.mjs github-dmg
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.macos-cache.outputs.cache-hit != 'true'
        with:
          path: |
            runtime/cargo-home/registry
            runtime/target
          key: ${{ steps.macos-cache.outputs.cache-primary-key }}
      - name: Verify the actual Finder installation window
        run: node scripts/verify-dmg-layout.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: orbit-macos-dmg-layout
          path: |
            runtime/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            runtime/logs/dmg/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
