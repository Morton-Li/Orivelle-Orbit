name: Release Orbit

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to verify, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orbit-release
  cancel-in-progress: false

jobs:
  source:
    name: Verify release source
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check stable tag and main ancestry
        id: source
        shell: bash
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$MANUAL_RELEASE_TAG"
          fi
          node scripts/github-release.mjs validate-tag "$tag"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: Sign and package macOS arm64
    needs: source
    runs-on: macos-15
    timeout-minutes: 90
    environment: codesign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/prepare-native
        with:
          release-tag: ${{ needs.source.outputs.tag }}

      - name: Build, self-sign and verify macOS release files
        env:
          ORBIT_RELEASE_UPDATER_PUBLIC_KEY: ${{ vars.ORBIT_RELEASE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_P12_BASE64 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: node scripts/native-workflow.mjs github-release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: orbit-release-macos
          path: runtime/github-release/
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Package Windows x64
    needs: source
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/prepare-native
        with:
          release-tag: ${{ needs.source.outputs.tag }}

      - name: Build NSIS installer
        run: node scripts/native-workflow.mjs github-bundle

      - name: Install and exercise the packaged Windows application
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'runtime/github-release' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw 'Expected exactly one Windows installer.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP ('Orbit Install ' + [Guid]::NewGuid().ToString('N'))
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "Orbit installation failed with exit code $($setup.ExitCode)."
          }
          $installed = Join-Path $installDir 'orivelle-orbit.exe'
          $built = 'runtime/target/x86_64-pc-windows-msvc/release/orivelle-orbit.exe'
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $built).Hash) {
            throw 'The installer payload differs from the compiled Windows application.'
          }
          ./tests/windows/with-panel-fixture.ps1 -Executable $installed

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: orbit-release-windows
          path: runtime/github-release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Verify and publish GitHub Release
    needs: [source, macos, windows]
    if: >-
      ${{
        !cancelled() && github.event_name == 'push' &&
        needs.source.result == 'success' &&
        needs.macos.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: orbit-release-*
          path: runtime/release-to-publish
          merge-multiple: true

      - name: Publish verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT_RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
          ORBIT_RELEASE_UPDATER_PUBLIC_KEY: ${{ vars.ORBIT_RELEASE_UPDATER_PUBLIC_KEY }}
        run: node scripts/github-release.mjs publish "$GITHUB_REF_NAME" runtime/release-to-publish
