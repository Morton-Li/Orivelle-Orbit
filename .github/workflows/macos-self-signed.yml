name: macOS arm64 Self-Signed Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-macos-self-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    name: Build and self-sign macOS arm64
    runs-on: macos-15
    environment: codesign
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-native

      - name: Build macOS arm64 application
        run: node scripts/native-workflow.mjs github-bundle

      - name: Self-sign and verify the disk image
        shell: bash
        env:
          CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_P12_BASE64 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: bash scripts/package-self-signed-macos.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: orbit-macos-arm64-self-signed
          path: runtime/candidates/*-macos-arm64-self-signed.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
