name: Prepare Orbit native build
description: Install the locked toolchain and run native build checks on a hosted runner
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Prepare the pinned tools
      shell: bash
      run: |
        set -euo pipefail
        npm_version="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
        if [[ "$(npm --version)" != "$npm_version" ]]; then
          npm install --prefix "$RUNNER_TEMP/orbit-npm" --no-save --no-package-lock --ignore-scripts "npm@$npm_version"
          node -e 'const fs = require("node:fs"); const path = require("node:path"); fs.appendFileSync(process.env.GITHUB_PATH, path.join(process.env.RUNNER_TEMP, "orbit-npm", "node_modules", ".bin") + "\n");'
        fi
        rust_channel="$(node -p 'require("node:fs").readFileSync("rust-toolchain.toml", "utf8").match(/^channel = "([^"]+)"/m)[1]')"
        if ! RUSTUP_DIST_SERVER=https://rsproxy.cn rustup toolchain install "$rust_channel" --profile minimal --component rustfmt --no-self-update; then
          rustup toolchain install "$rust_channel" --profile minimal --component rustfmt --no-self-update
        fi
        node -e 'const fs = require("node:fs"); const path = require("node:path"); const {execFileSync} = require("node:child_process"); const rustc = execFileSync("rustup", ["which", "--toolchain", process.argv[1], "rustc"], {encoding:"utf8"}).trim(); fs.appendFileSync(process.env.GITHUB_ENV, "ORBIT_RUST_BIN=" + path.dirname(rustc) + "\n");' "$rust_channel"
        if [[ "$RUNNER_OS" == macOS ]]; then
          printf 'ORBIT_DEVELOPER_DIR=%s\n' "$(xcode-select -p)" >> "$GITHUB_ENV"
          printf 'ORBIT_MAC_SDK=%s\n' "$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
        fi

    - name: Install locked dependencies
      shell: bash
      run: npm ci

    - name: Check Orbit
      shell: bash
      run: |
        set -euo pipefail
        node scripts/native-workflow.mjs preflight
        npm run check
        node --test tests/build/*.test.mjs
        node scripts/native-workflow.mjs check
